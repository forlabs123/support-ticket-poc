<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketFlow PoC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>TicketFlow PoC</h1>
    <p class="description">Демонстрация классификации, безопасного автоответа и эскалации тикетов.</p>
    <p id="health" class="status">Проверяем backend…</p>

    <section>
      <h2>Тестовый тикет</h2>
      <label for="ticket">Текст обращения</label>
      <textarea id="ticket" maxlength="5000">Как отменить подписку? Больше не хочу ей пользоваться.</textarea>

      <div class="examples">
        <button type="button" data-example="Как отменить подписку? Больше не хочу ей пользоваться.">Пример: низкий риск</button>
        <button type="button" data-example="Мой аккаунт взломали и с карты украли деньги. Срочно помогите!">Пример: высокий риск</button>
      </div>

      <label for="channel">Канал</label>
      <select id="channel">
        <option value="web">Веб-форма</option>
        <option value="chat">Чат</option>
        <option value="email">Email</option>
        <option value="mobile">Приложение</option>
      </select>
      <button type="button" id="submit" class="primary">Обработать тикет</button>
    </section>

    <section>
      <h2>Результат</h2>
      <div id="result" class="result muted">Отправьте тикет для демонстрации сценария.</div>
    </section>

    <section>
      <div class="section-heading">
        <h2>Журнал решений</h2>
        <button type="button" id="refresh">Обновить</button>
      </div>
      <p class="muted">Последние записи аудита из backend.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Тикет</th><th>Тема</th><th>Риск</th><th>Решение</th><th>Время</th></tr></thead>
          <tbody id="audit"><tr><td colspan="5" class="muted">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
